[workspace]
resolver = "2"
members = [
  "crates/procman-core",
  "crates/procman-cli",
  "app/src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
procman-core = { path = "crates/procman-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
